<div>
    <label class="block text-sm font-semibold text-slate-700 mb-1">
        ระดับชั้น / สถานะผู้ประเมิน <span class="text-red-500">*</span>
    </label>
    <select id="studentGrade" required class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-sky-500 focus:border-sky-500 outline-none transition">
        <option value="">-- เลือกระดับชั้น / สถานะ --</option>
        
        <!-- กลุ่มระดับชั้นนักเรียน -->
        <optgroup label="ระดับชั้น (นักเรียน)">
            <option value="ม.1">มัธยมศึกษาปีที่ 1</option>
            <option value="ม.2">มัธยมศึกษาปีที่ 2</option>
            <option value="ม.3">มัธยมศึกษาปีที่ 3</option>
            <option value="ม.4">มัธยมศึกษาปีที่ 4</option>
            <option value="ม.5">มัธยมศึกษาปีที่ 5</option>
            <option value="ม.6">มัธยมศึกษาปีที่ 6</option>
        </optgroup>
        
        <!-- กลุ่มอาจารย์/บุคลากร/บุคคลภายนอก -->
        <optgroup label="สถานะอื่น ๆ">
            <option value="ครู / อาจารย์ / บุคลากร">ครู / อาจารย์ / บุคลากร</option>
            <option value="บุคคลภายนอก / อื่นๆ">บุคคลภายนอก / อื่นๆ</option>
        </optgroup>
    </select>
